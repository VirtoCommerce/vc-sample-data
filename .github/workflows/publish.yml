# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the master branch
on:
  push:
    branches: [ master, release/3.0.0 ]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
    # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
    - uses: actions/checkout@v5
      with:
        lfs: true

    # Runs a single command using the runners shell
    - name: Zip sample data
      run: zip -r b2b-sample-store.zip ./Setup/B2BSampleStore/ -j -x '*.gitattributes*'

    # Azure CLI is preinstalled on GitHub-hosted Ubuntu runners
    - name: Upload a Build Artifact to Azure Blob Storage
      env:
        AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.BLOB_STORAGE_CONNECTION_STRING }}
      run: |
        az storage container create --name sample-data --only-show-errors
        az storage blob upload --container-name sample-data --name b2b-sample-store.zip --file b2b-sample-store.zip --overwrite --only-show-errors
